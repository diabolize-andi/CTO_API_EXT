openapi: "3.0.0"
info:
  version: "2.0.0"
  title: Click and Take off - Flight Fetch and Assignment API
servers:
  - url: "https://dev.clickandtakeoff.com/api"
  - url: "https://my.clickandtakeoff.com/api"
security:
  - bearerAuth: []
paths:
  "/cto/flight":
    get:
      summary: Fetch a list of flights
      tags:
        - "Flight"
      description: |
        Returns flights for the requested device and club. All parameters are sent in the URL query string.
        Assignment filters accept `true` / `1` and `false` / `0` (case-insensitive for words).
        If both are false or both are true, all flights are returned. If exactly one is true,
        only flights with that assignment status are returned. A GET request needs no form body.
      parameters:
        - name: device
          in: query
          description: "F-XXXX"
          required: true
          schema:
            type: string
        - name: club
          in: query
          description: "Click and Take Off"
          required: true
          schema:
            type: string
        - name: from
          in: query
          description: "in ISO 8601 format. eg. `1963-11-22T18:30:00Z`"
          required: true
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: "in ISO 8601 format. eg. `1963-11-22T18:30:00Z`"
          required: true
          schema:
            type: string
            format: date-time
        - name: nonAssigned
          in: query
          description: "Return only unassigned flights when true and assigned is false. Defaults to false."
          required: false
          schema:
            type: string
            default: "false"
        - name: assigned
          in: query
          description: "Return only assigned flights when true and nonAssigned is false. Defaults to false."
          required: false
          schema:
            type: string
            default: "false"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FlightCtoItems"
        "400":
          description: ERROR
        "401":
          description: Unauthorized / Token not valid for this club
        "402":
          description: CTO server is not available. Please try later
        "404":
          description: Club not found / Device not found
        "429":
          description: Too many requests

    put:
      summary: Flight Assignment
      description: |
        Send the parameters in the application/x-www-form-urlencoded request body.
        Identify the pilot by pilotId or pilotEmail; an instructor is optional. Use the exact
        flight start and end timestamps returned by the API. volId is not an assignment parameter.
      tags:
        - "Flight"
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [device, club, from, to]
              properties:
                device:
                  type: string
                  description: "F-XXXX"
                club:
                  type: string
                  description: "Click and Take off"
                pilotEmail:
                  type: string
                  description: "test@test.cto"
                instructorEmail:
                  type: string
                  description: "test@test.cto"
                pilotId:
                  type: integer
                  description: "0"
                instructorId:
                  type: integer
                  description: "0"
                from:
                  type: string
                  description: "in ISO 8601 format. eg. `1963-11-22T18:30:00Z`"
                  format: date-time
                to:
                  type: string
                  description: "in ISO 8601 format. eg. `1963-11-22T18:30:00Z`"
                  format: date-time
      responses:
        "200":
          description: Flight has been assigned correctly
        "401":
          description: Unauthorized
        "400":
          description: ERROR / Pilot not indicated
        "403":
          description: No flight matching the supplied dates was found
        "402":
          description: CTO server is not available. Please try later
        "404":
          description: Club not found / Device not found / Instructor not found 
        "406":
          description: Pilot not found
        "409":
          description: Conflict / Choose a pilot in the indicated club

components:
  schemas:
    FlightCtoItems:
      type: object
      properties:
        volId:
          type: integer
          format: int64
          description: Internal flight identifier; not accepted as an assignment parameter
        deviceId:
          type: integer
          format: int64
          description: Internal device identifier
        clubName:
          type: string
          nullable: true
        deviceName:
          type: string
        startTime:
          description: "Flight start timestamp, subject to the device's external time export mode"
          type: string
          format: date-time
        endTime:
          description: "Flight end timestamp, subject to the device's external time export mode"
          type: string
          format: date-time
        startTimeFlight:
          description: "Alternative flight start timestamp; may be absent and depends on the device's external time export mode"
          type: string
          format: date-time
          nullable: true
        endTimeFlight:
          description: "Alternative flight end timestamp; may be absent and depends on the device's external time export mode"
          type: string
          format: date-time
          nullable: true
        icaoAeroStart:
          type: string
          nullable: true
          description: "Starting aerodrome"
        icaoAeroEnd:
          type: string
          nullable: true
          description: "Arrival aerodrome"
        hourMeterStart:
          type: integer
          format: int64
          nullable: true
          description: "Engine start hour meter"
        hourMeterStartFlight:
          type: integer
          format: int64
          nullable: true
          description: "Movement start hour meter"
        hourMeterEnd:
          type: integer
          format: int64
          nullable: true
          description: "Engine stop hour meter"
        hourMeterEndFlight:
          type: integer
          format: int64
          nullable: true
          description: "Movement stop hour meter"
        icao:
          type: array
          nullable: true
          items:
            type: string
          description: "List of aerodrome where ther are some touch and go"
        pilotEmail:
          type: string
          nullable: true
          description: "Pilot email address, null when unavailable or not assigned"
        instructorEmail:
          type: string
          nullable: true
          description: "Instructor email address, null when unavailable or not assigned"
        landing:
          type: integer
          nullable: true
          description: "Number of landings when analysis is available; may be null"
        latitude:
          type: array
          nullable: true
          items:
            type: number
            format: double
        longitude:
          type: array
          nullable: true
          items:
            type: number
            format: double
        altitude:
          type: array
          nullable: true
          items:
            type: integer
        time:
          type: array
          nullable: true
          items:
            type: string
            format: date-time

  securitySchemes:
    bearerAuth:
      type: apiKey
      description: Token authorization for identify club in the case of externe call of api
      name: Authorization
      in: header
